<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ghada ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at 50% 40%, #45102f, transparent 65%),
        linear-gradient(135deg, #090711, #1b0928, #080611);
}

#stars, #particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#stars { z-index: 0; }
#particles { z-index: 5; }

.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    background: #ff167c;
    filter: blur(150px);
    opacity: .25;
    animation: glow 4s ease-in-out infinite alternate;
}

@keyframes glow {
    to { transform: scale(1.4); opacity: .5; }
}

.card {
    position: relative;
    z-index: 2;
    width: min(92%, 500px);
    padding: 35px 24px;
    text-align: center;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 30px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 70px #ff176b12;
    animation: appear 1s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    border: 1px solid #ff7bac55;
    border-radius: 50px;
    color: #ffb2d1;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 400;
}

h1 span { color: #ff77ae; }

.subtitle {
    color: #cbb9d2;
    font-size: 13px;
    margin: 15px 0 25px;
    line-height: 1.8;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    min-height: 65px;
}

button {
    border: 0;
    padding: 13px 32px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

#yes {
    color: white;
    background: linear-gradient(135deg, #ff6ba5, #e60062);
    box-shadow: 0 0 25px #ff176b55;
}

#yes:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px #ff176b99;
}

#no {
    color: #ffc4dc;
    background: #ffffff08;
    border: 1px solid #ff9dc544;
    white-space: nowrap;
}

#no.running {
    position: fixed;
    z-index: 20;
    transition: left .15s ease, top .15s ease;
}

#heartScene {
    display: none;
    position: relative;
    width: 100%;
    height: 350px;
    align-items: center;
    justify-content: center;
    isolation: isolate;
}

#heartScene.show {
    display: flex;
    animation: heartReveal 1.2s ease both;
}

@keyframes heartReveal {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: scale(1); }
}

#heartCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
}

.heart-wrap {
    width: min(100%, 330px);
    aspect-ratio: 1 / .95;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px #ff176b)
            drop-shadow(0 0 35px #ff176b66);
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.06); }
    30% { transform: scale(1); }
    45% { transform: scale(1.09); }
    60% { transform: scale(1); }
}

.heart-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.heart-name {
    position: relative;
    z-index: 3;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(48px, 12vw, 68px);
    color: white;
    text-shadow: 0 0 8px white, 0 0 25px #ff78b8, 0 0 45px #ff0757;
    animation: nameGlow 2s ease-in-out infinite alternate;
}

@keyframes nameGlow {
    to { text-shadow: 0 0 20px white, 0 0 50px #ff176b; }
}

.crown {
    position: absolute;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    color: #fff0f8;
    z-index: 3;
    text-shadow: 0 0 15px white;
}

.energy-ring {
    position: absolute;
    width: 150px;
    height: 150px;
    border: 1px solid #ff6bb1;
    border-radius: 50%;
    box-shadow: 0 0 18px #ff176b44;
    pointer-events: none;
}

.ring1 { animation: ring 3s infinite; }
.ring2 { animation: ring 3s 1s infinite; }
.ring3 { animation: ring 3s 2s infinite; }

@keyframes ring {
    0% { transform: scale(.7); opacity: 0; }
    20% { opacity: .8; }
    100% { transform: scale(2); opacity: 0; }
}

.caption {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    color: #ffb3d3;
    font-size: 10px;
    letter-spacing: 4px;
}

.message {
    display: none;
    color: #e7cfdf;
    font-size: 13px;
    line-height: 1.9;
    margin-top: 10px;
    animation: appear 1s ease;
}

.message.show { display: block; }

.message strong {
    display: block;
    font-family: 'Great Vibes', cursive;
    font-size: 34px;
    color: #ff91bd;
    font-weight: 400;
}

.footer {
    margin-top: 25px;
    color: #8d718e;
    font-size: 9px;
    letter-spacing: 3px;
}

@media (max-width: 400px) {
    .card { padding: 30px 16px; }
    #heartScene { height: 300px; }
}
</style>
</head>

<body>

<div class="glow"></div>
<canvas id="stars"></canvas>
<canvas id="particles"></canvas>

<main class="card">

    <div class="badge">A LITTLE QUESTION FOR YOU</div>

    <section id="question">
        <h1>Do you feel <span>good?</span></h1>

        <p class="subtitle">
            There's something special waiting for you... 💗
        </p>

        <div class="buttons">
            <button id="yes">Yes ❤️</button>
            <button id="no">No 🙈</button>
        </div>
    </section>

    <section id="heartScene">

        <canvas id="heartCanvas"></canvas>

        <div class="energy-ring ring1"></div>
        <div class="energy-ring ring2"></div>
        <div class="energy-ring ring3"></div>

        <div class="heart-wrap">

            <svg class="heart-svg" viewBox="0 0 300 280">
                <defs>
                    <linearGradient id="heartGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffd5ed"/>
                        <stop offset="25%" stop-color="#ff559e"/>
                        <stop offset="60%" stop-color="#ff0757"/>
                        <stop offset="100%" stop-color="#680024"/>
                    </linearGradient>

                    <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="white" stop-opacity=".7"/>
                        <stop offset="45%" stop-color="#ffb9e4" stop-opacity=".05"/>
                        <stop offset="100%" stop-color="#ff174f" stop-opacity=".3"/>
                    </linearGradient>

                    <filter id="glow">
                        <feGaussianBlur stdDeviation="5" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <path d="M150 260 C125 230 10 150 10 82 C10 10 105 -5 150 65 C195 -5 290 10 290 82 C290 150 175 230 150 260Z"
                    fill="url(#heartGradient)"
                    stroke="#ffb8e2"
                    stroke-width="2"
                    filter="url(#glow)"/>

                <path d="M150 260 C125 230 10 150 10 82 C10 10 105 -5 150 65 C195 -5 290 10 290 82 C290 150 175 230 150 260Z"
                    fill="url(#glassGradient)"
                    stroke="white"
                    stroke-opacity=".7"
                    stroke-width="1.5"/>

                <path d="M35 80 C40 30 90 20 120 48"
                    fill="none" stroke="white" stroke-opacity=".8"
                    stroke-width="3" stroke-linecap="round"/>

                <path d="M185 38 C225 17 260 48 263 76"
                    fill="none" stroke="white" stroke-opacity=".7"
                    stroke-width="2" stroke-linecap="round"/>

                <g fill="white" filter="url(#glow)">
                    <circle cx="42" cy="105" r="3"/>
                    <circle cx="253" cy="108" r="3"/>
                    <circle cx="95" cy="180" r="2"/>
                    <circle cx="210" cy="177" r="2.5"/>
                </g>
            </svg>

            <span class="crown">♕</span>
            <h2 class="heart-name">Ghada</h2>

        </div>

        <div class="caption">YOU ARE SPECIAL ✨</div>

    </section>

    <div class="message" id="message">
        <strong>For you, Ghada ❤️</strong>
        You deserve all the happiness in the world.
        <br>Never forget how special you are. ✨
    </div>

    <div class="footer">MADE WITH LOVE ♡ JUST FOR GHADA</div>

</main>

<script>
const question = document.getElementById("question");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const heartScene = document.getElementById("heartScene");
const message = document.getElementById("message");

// Star background
const starsCanvas = document.getElementById("stars");
const starsCtx = starsCanvas.getContext("2d");
let stars = [];

function resizeStars() {
    starsCanvas.width = innerWidth * devicePixelRatio;
    starsCanvas.height = innerHeight * devicePixelRatio;
    starsCanvas.style.width = innerWidth + "px";
    starsCanvas.style.height = innerHeight + "px";
    starsCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    stars = Array.from({length: 120}, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.7 + .3,
        a: Math.random(),
        speed: Math.random() * .015 + .003
    }));
}

function drawStars() {
    starsCtx.clearRect(0, 0, innerWidth, innerHeight);

    stars.forEach(s => {
        s.a += s.speed;
        starsCtx.beginPath();
        starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starsCtx.fillStyle = `rgba(255,210,235,${.2 + Math.abs(Math.sin(s.a)) * .8})`;
        starsCtx.fill();
    });

    requestAnimationFrame(drawStars);
}

resizeStars();
drawStars();
window.addEventListener("resize", resizeStars);

// Escaping NO button
function escapeButton(x, y) {
    const rect = noBtn.getBoundingClientRect();

    if (Math.hypot(
        rect.left + rect.width / 2 - x,
        rect.top + rect.height / 2 - y
    ) > 120) return;

    noBtn.classList.add("running");

    const padding = 15;
    const maxX = Math.max(padding, innerWidth - rect.width - padding);
    const maxY = Math.max(padding, innerHeight - rect.height - padding);

    let nx, ny;

    for (let i = 0; i < 25; i++) {
        nx = padding + Math.random() * (maxX - padding);
        ny = padding + Math.random() * (maxY - padding);

        if (Math.hypot(nx + rect.width/2 - x, ny + rect.height/2 - y) > 180) break;
    }

    noBtn.style.left = nx + "px";
    noBtn.style.top = ny + "px";
}

document.addEventListener("mousemove", e => {
    if (question.style.display !== "none") {
        escapeButton(e.clientX, e.clientY);
    }
});

noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    escapeButton(Math.random() * innerWidth, Math.random() * innerHeight);
}, {passive:false});

noBtn.addEventListener("click", e => {
    e.preventDefault();
    escapeButton(Math.random() * innerWidth, Math.random() * innerHeight);
});

// Particle canvas
const particleCanvas = document.getElementById("particles");
const pctx = particleCanvas.getContext("2d");
let particles = [];
let heartAnimationRunning = false;

function resizeParticles() {
    particleCanvas.width = innerWidth * devicePixelRatio;
    particleCanvas.height = innerHeight * devicePixelRatio;
    particleCanvas.style.width = innerWidth + "px";
    particleCanvas.style.height = innerHeight + "px";
    pctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

resizeParticles();
window.addEventListener("resize", resizeParticles);

function addParticle() {
    particles.push({
        x: innerWidth * (.25 + Math.random() * .5),
        y: innerHeight * (.35 + Math.random() * .4),
        vx: (Math.random() - .5) * 1.5,
        vy: -Math.random() * 1.5 - .3,
        size: Math.random() * 3 + .5,
        life: 1,
        decay: .004 + Math.random() * .012
    });
}

function animateParticles() {
    pctx.clearRect(0, 0, innerWidth, innerHeight);

    if (heartScene.classList.contains("show")) {
        if (particles.length < 130 && Math.random() > .3) addParticle();

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;

            pctx.save();
            pctx.globalAlpha = Math.max(0, p.life);
            pctx.fillStyle = Math.random() > .5 ? "#ff82bf" : "#ffffff";
            pctx.shadowBlur = 15;
            pctx.shadowColor = "#ff176b";
            pctx.beginPath();
            pctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            pctx.fill();
            pctx.restore();

            if (p.life <= 0) particles.splice(i, 1);
        });
    }

    requestAnimationFrame(animateParticles);
}

animateParticles();

// YES button reveals the heart
yesBtn.addEventListener("click", () => {
    question.style.display = "none";
    noBtn.style.display = "none";

    heartScene.classList.add("show");
    message.classList.add("show");

    // Burst of magical particles
    for (let i = 0; i < 70; i++) {
        setTimeout(addParticle, i * 25);
    }
});
</script>

</body>
</html>
